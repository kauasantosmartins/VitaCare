plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.microsoft.sqlserver:mssql-jdbc:13.6.0.jre11'
}

javafx {
    version = '21'
    modules = ['javafx.controls']
}

application {
    mainClass = 'boundary.MainBoundary'
}

// Autenticacao integrada do Windows: carregar DLL da pasta libs ao executar.
tasks.named('run', JavaExec) {
    jvmArgs '-Djava.library.path=' + file('libs').absolutePath
}
